<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send a Message | Eagle Point Coaching</title>
<meta name="description" content="Get in touch with Eagle Point Coaching to ask a question or start your executive coaching journey.">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="story-header">
  <!-- Shared nav (mobile-nav + corner-menu), injected by script.js -->
  <div id="site-nav"></div>

  <!-- Logo sits on the right on every page but the homepage; it doubles
       as the way back to the homepage, so there's no separate back link -->
  <a href="index.html" class="story-wordmark"><img class="story-logo" src="assets/images/eagle-point-logo.png" alt="Eagle Point Coaching logo"></a>
</header>

<main class="contact">
  <h1 class="story-heading">Send a Message</h1>
  <p class="contact-subheading">Let&rsquo;s hear from you!</p>

  <!-- Not a submitting form — there's no backend. Clicking Send hands the
       values to a mailto: link instead, built by script.js. -->
  <form class="contact-form" id="contact-form" novalidate>
    <div class="form-field">
      <label for="contact-name">Name</label>
      <input type="text" id="contact-name" name="name" autocomplete="name">
    </div>

    <div class="form-field">
      <label for="contact-email">Email</label>
      <input type="email" id="contact-email" name="email" autocomplete="email">
    </div>

    <div class="form-field">
      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="message" rows="6"></textarea>
    </div>

    <p class="contact-helper">Clicking send will open your email app with this message ready to go.</p>

    <p class="contact-status" id="contact-status" role="alert" hidden></p>

    <button type="submit" class="book-btn contact-submit">Send</button>
  </form>
</main>

<!-- Shared footer, injected by script.js -->
<div id="site-footer"></div>

<script src="script.js"></script>
</body>
</html>

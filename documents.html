<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents | Eagle Point Coaching</title>
<meta name="description" content="Access Eagle Point Coaching's welcome packet, client questionnaire, and coaching agreements in one place.">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="story-header">
  <!-- Shared nav (mobile-nav + corner-menu), injected by script.js -->
  <div id="site-nav"></div>

  <!-- Logo sits on the right on every page but the homepage; it doubles
       as the way back to the homepage, so there's no separate back link -->
  <a href="index.html" class="story-wordmark"><img class="story-logo" src="assets/images/eagle-point-logo.png" alt="Eagle Point Coaching logo"></a>
</header>

<main class="documents">
  <h1 class="story-heading">Documents</h1>

  <section class="doc-section">
    <h2 class="doc-section-heading">Documents</h2>

    <div class="doc-list">
      <article class="doc-card">
        <div class="doc-info">
          <span class="doc-type">PDF</span>
          <h3 class="doc-title">Welcome Packet</h3>
        </div>
        <div class="doc-actions">
          <a href="documents/welcome-packet.pdf" target="_blank" rel="noopener" class="doc-action">View</a>
          <a href="documents/welcome-packet.pdf" download class="doc-action">Download</a>
        </div>
      </article>

      <article class="doc-card">
        <div class="doc-info">
          <span class="doc-type">PDF</span>
          <h3 class="doc-title">Primary Questionnaire</h3>
        </div>
        <div class="doc-actions">
          <a href="documents/primary-questionnaire.pdf" target="_blank" rel="noopener" class="doc-action">View</a>
          <a href="documents/primary-questionnaire.pdf" download class="doc-action">Download</a>
        </div>
      </article>
    </div>
  </section>

  <section class="doc-section">
    <h2 class="doc-section-heading">Contracts</h2>

    <div class="doc-empty">
      <svg class="doc-empty-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M11 5 H23 L29 11 V35 H11 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M23 5 V11 H29" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <line x1="15" y1="19" x2="25" y2="19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="15" y1="24" x2="25" y2="24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="15" y1="29" x2="21" y2="29" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <p>Signed coaching agreements will appear here once your engagement begins.</p>
    </div>
  </section>
</main>

<!-- Shared footer, injected by script.js -->
<div id="site-footer"></div>

<script src="script.js"></script>
</body>
</html>

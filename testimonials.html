  <figure class="testimonial-entry section-dark">
    <div class="testimonial-entry-inner">
      <blockquote class="testimonial-quote">
        <p>&ldquo;Working with Meaghan Janedis was hands down the best decision I&rsquo;ve made for my personal growth and career! Her coaching strategies were incredibly effective as she equipped me with groundbreaking strategies to advocate for myself in negotiating for a raise in a professional and assertive manner. Thanks to her impeccable guidance, I secured a 15% raise, but more importantly, confidence in advocating for myself. Meaghan&rsquo;s approach is truly empowering. She didn&rsquo;t just teach me negotiation tactics, but transformed my mindset, teaching me how to own my value in every professional setting. Meaghan is truly the secret weapon to your career. I could not recommend her more!&rdquo;</p>
      </blockquote>
      <figcaption class="quote-attribution">
        Sophia Z.
        <span class="quote-affiliation">Fordham University</span>
      </figcaption>
    </div>
  </figure>

  <figure class="testimonial-entry">
    <!-- Handoff arrow 1 of 3: right side, then alternating down the page.

    <div class="testimonial-entry-inner">
      <blockquote class="testimonial-quote">
        <p>&ldquo;I am extremely grateful for my Executive Coach Meaghan Janedis and all the support she continues to give me on my journey to law school. As a rising sophomore at the University of Pennsylvania, I knew I wanted to pursue a legal career but wasn&rsquo;t sure what I should be doing now to set myself up for success. I needed guidance, structure, and someone to help me think strategically about the path ahead, and Meaghan provided all of that and more.</p>
        <p>She&rsquo;s helped me clarify my long-term goals and build a realistic, sustainable study schedule for the LSAT. More than that, she&rsquo;s helped me grow into someone who believes in their ability to succeed in this field. With her coaching, I&rsquo;ve been able to identify the skills, habits, and mindset I need to develop to become a strong candidate for internships and law school. She has helped me build trust in my voice and focus on key skills like faster reading, clear communication, and speaking with confidence. During my internship, she also guided me on how to make the most of the experience by staying focused and intentional about what I could learn and how I could contribute meaningfully.</p>
        <p>Furthermore, Meaghan introduced me to the power of networking, and her advice has helped me connect with people in meaningful, strategic ways. Meaghan has also recommended as part of my sessions, several books that we read and discuss together which have changed my life and I have recommended to many, including my entire family and friend circle!</p>
        <p>Most importantly, Meaghan believed in me. Through her coaching, I&rsquo;ve learned how to advocate for myself, stay disciplined, and trust the process. Her approach is holistic! Eagle Point Coaching has truly made a difference in my life, and I couldn&rsquo;t recommend it more highly to anyone considering to level up their career.&rdquo;</p>
      </blockquote>
      <figcaption class="quote-attribution">
        Lindsey N.
        <span class="quote-affiliation">University of Pennsylvania</span>
      </figcaption>
    </div>
  </figure>

    <div class="testimonial-entry-inner">
      <blockquote class="testimonial-quote">
        <p>&ldquo;Working with Meaghan has been a truly transformative experience. Our sessions were always centered around what I wanted to work on and improve. She never imposed a set agenda &mdash; instead, she met me where I was and guided our conversations in a way that felt both purposeful and empowering. She consistently encouraged me to think outside the box and consider perspectives I hadn&rsquo;t explored before. Her approach was always personalized, supportive, and focused on helping me grow.</p>
        <p>From our very first session, I began to see meaningful changes &mdash; not just in how I approach my career, but in how I viewed myself. Meaghan challenged and expanded my mindset in ways I never thought possible. Her guidance helped me unlock a level of confidence and clarity I didn&rsquo;t know I had. For the first time, I truly feel capable of achieving success and making my loved ones proud.</p>
        <p>Her impact has been profound, and I recommend her wholeheartedly to anyone who feels uncertain about their direction or potential. She is truly amazing at what she does &mdash; you will be excited to work with her every week!&rdquo;</p>
      </blockquote>
